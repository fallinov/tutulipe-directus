version: 1
directus: "11.0.0"

collections:
  # ─── Pages ───────────────────────────────────────────
  - collection: pages
    meta:
      collection: pages
      icon: article
      note: "Pages statiques du site (à propos, contact, etc.)"
      display_template: "{{titre}}"
      sort_field: null
      accountability: all
      group: null
      singleton: false
      versioning: true
      translations:
        - language: fr-FR
          translation: Pages
    schema:
      name: pages

  # ─── Articles ────────────────────────────────────────
  - collection: articles
    meta:
      collection: articles
      icon: newspaper
      note: "Articles du blog"
      display_template: "{{titre}}"
      sort_field: null
      accountability: all
      group: null
      singleton: false
      versioning: true
      translations:
        - language: fr-FR
          translation: Articles
    schema:
      name: articles

  # ─── Produits ────────────────────────────────────────
  - collection: produits
    meta:
      collection: produits
      icon: local_florist
      note: "Catalogue de produits"
      display_template: "{{nom}} — {{prix}} CHF"
      sort_field: null
      accountability: all
      group: null
      singleton: false
      versioning: true
      translations:
        - language: fr-FR
          translation: Produits
    schema:
      name: produits

  # ─── Paramètres du site (singleton) ──────────────────
  - collection: parametres_site
    meta:
      collection: parametres_site
      icon: settings
      note: "Configuration générale du site"
      display_template: "{{nom_du_site}}"
      sort_field: null
      accountability: all
      group: null
      singleton: true
      versioning: false
      translations:
        - language: fr-FR
          translation: Paramètres du site
    schema:
      name: parametres_site

fields:
  # ═══════════════════════════════════════════════════════
  # PAGES
  # ═══════════════════════════════════════════════════════
  - collection: pages
    field: id
    type: integer
    meta:
      hidden: true
      interface: input
      readonly: true
      special:
        - auto-increment
    schema:
      is_primary_key: true
      has_auto_increment: true

  - collection: pages
    field: titre
    type: string
    meta:
      interface: input
      required: true
      width: full
      translations:
        - language: fr-FR
          translation: Titre de la page
    schema:
      is_nullable: false

  - collection: pages
    field: slug
    type: string
    meta:
      interface: input
      options:
        slug: true
      note: "Généré automatiquement depuis le titre — ne pas modifier sans raison."
      width: half
      translations:
        - language: fr-FR
          translation: Identifiant URL
    schema:
      is_unique: true
      is_nullable: false

  - collection: pages
    field: contenu
    type: text
    meta:
      interface: input-rich-text-html
      width: full
      translations:
        - language: fr-FR
          translation: Contenu
    schema:
      is_nullable: true

  - collection: pages
    field: meta_description
    type: text
    meta:
      interface: input-multiline
      options:
        trim: true
      note: "Maximum 160 caractères — utilisé par les moteurs de recherche."
      width: full
      validation:
        _and:
          - _or:
              - meta_description:
                  _null: true
              - meta_description:
                  _regex: "^.{0,160}$"
      translations:
        - language: fr-FR
          translation: Description SEO
    schema:
      is_nullable: true

  - collection: pages
    field: statut
    type: string
    meta:
      interface: select-dropdown
      options:
        choices:
          - text: Publié
            value: published
          - text: Brouillon
            value: draft
      note: "Publié = visible sur le site. Brouillon = visible uniquement ici."
      width: half
      display: labels
      display_options:
        choices:
          - text: Publié
            value: published
            foreground: "#FFFFFF"
            background: "#2ECB71"
          - text: Brouillon
            value: draft
            foreground: "#FFFFFF"
            background: "#95A5A5"
      translations:
        - language: fr-FR
          translation: Statut
    schema:
      default_value: draft
      is_nullable: false

  # ═══════════════════════════════════════════════════════
  # ARTICLES
  # ═══════════════════════════════════════════════════════
  - collection: articles
    field: id
    type: integer
    meta:
      hidden: true
      interface: input
      readonly: true
      special:
        - auto-increment
    schema:
      is_primary_key: true
      has_auto_increment: true

  # Groupe Contenu
  - collection: articles
    field: groupe_contenu
    type: alias
    meta:
      interface: group-raw
      special:
        - alias
        - no-data
        - group
      translations:
        - language: fr-FR
          translation: Contenu

  - collection: articles
    field: titre
    type: string
    meta:
      interface: input
      required: true
      width: full
      group: groupe_contenu
      translations:
        - language: fr-FR
          translation: Titre
    schema:
      is_nullable: false

  - collection: articles
    field: image
    type: uuid
    meta:
      interface: file-image
      note: "Format recommandé : JPG ou WebP, minimum 1200×800px."
      width: full
      group: groupe_contenu
      special:
        - file
      translations:
        - language: fr-FR
          translation: Image principale
    schema:
      is_nullable: true

  - collection: articles
    field: contenu
    type: text
    meta:
      interface: input-rich-text-html
      width: full
      group: groupe_contenu
      translations:
        - language: fr-FR
          translation: Contenu
    schema:
      is_nullable: true

  # Groupe Publication
  - collection: articles
    field: groupe_publication
    type: alias
    meta:
      interface: group-raw
      special:
        - alias
        - no-data
        - group
      translations:
        - language: fr-FR
          translation: Publication

  - collection: articles
    field: statut
    type: string
    meta:
      interface: select-dropdown
      options:
        choices:
          - text: Publié
            value: published
          - text: Brouillon
            value: draft
      note: "Publié = visible sur le site. Brouillon = visible uniquement ici."
      width: half
      group: groupe_publication
      display: labels
      display_options:
        choices:
          - text: Publié
            value: published
            foreground: "#FFFFFF"
            background: "#2ECB71"
          - text: Brouillon
            value: draft
            foreground: "#FFFFFF"
            background: "#95A5A5"
      translations:
        - language: fr-FR
          translation: Statut
    schema:
      default_value: draft
      is_nullable: false

  - collection: articles
    field: date_publication
    type: timestamp
    meta:
      interface: datetime
      width: half
      group: groupe_publication
      conditions:
        - rule:
            _and:
              - statut:
                  _eq: published
          hidden: false
        - rule:
            _and:
              - statut:
                  _neq: published
          hidden: true
      translations:
        - language: fr-FR
          translation: Date de publication
    schema:
      is_nullable: true

  - collection: articles
    field: slug
    type: string
    meta:
      interface: input
      options:
        slug: true
      note: "Généré automatiquement depuis le titre — ne pas modifier sans raison."
      width: half
      group: groupe_publication
      translations:
        - language: fr-FR
          translation: Identifiant URL
    schema:
      is_unique: true
      is_nullable: false

  # Groupe SEO
  - collection: articles
    field: groupe_seo
    type: alias
    meta:
      interface: group-raw
      special:
        - alias
        - no-data
        - group
      translations:
        - language: fr-FR
          translation: SEO

  - collection: articles
    field: meta_description
    type: text
    meta:
      interface: input-multiline
      options:
        trim: true
      note: "Maximum 160 caractères — utilisé par les moteurs de recherche."
      width: full
      group: groupe_seo
      translations:
        - language: fr-FR
          translation: Description SEO
    schema:
      is_nullable: true

  # ═══════════════════════════════════════════════════════
  # PRODUITS
  # ═══════════════════════════════════════════════════════
  - collection: produits
    field: id
    type: integer
    meta:
      hidden: true
      interface: input
      readonly: true
      special:
        - auto-increment
    schema:
      is_primary_key: true
      has_auto_increment: true

  - collection: produits
    field: nom
    type: string
    meta:
      interface: input
      required: true
      width: full
      translations:
        - language: fr-FR
          translation: Nom du produit
    schema:
      is_nullable: false

  - collection: produits
    field: slug
    type: string
    meta:
      interface: input
      options:
        slug: true
      note: "Généré automatiquement depuis le nom — ne pas modifier sans raison."
      width: half
      translations:
        - language: fr-FR
          translation: Identifiant URL
    schema:
      is_unique: true
      is_nullable: false

  - collection: produits
    field: description
    type: text
    meta:
      interface: input-rich-text-html
      width: full
      translations:
        - language: fr-FR
          translation: Description
    schema:
      is_nullable: true

  - collection: produits
    field: prix
    type: decimal
    meta:
      interface: input
      options:
        min: 0
        step: 0.05
      note: "Prix en francs suisses (CHF)"
      width: half
      translations:
        - language: fr-FR
          translation: Prix (CHF)
    schema:
      numeric_precision: 10
      numeric_scale: 2
      is_nullable: true

  - collection: produits
    field: image
    type: uuid
    meta:
      interface: file-image
      note: "Format recommandé : JPG ou WebP, minimum 1200×800px."
      width: half
      special:
        - file
      translations:
        - language: fr-FR
          translation: Image principale
    schema:
      is_nullable: true

  - collection: produits
    field: categorie
    type: string
    meta:
      interface: select-dropdown
      options:
        choices:
          - text: Bouquets
            value: bouquets
          - text: Plantes
            value: plantes
          - text: Accessoires
            value: accessoires
      width: half
      display: labels
      translations:
        - language: fr-FR
          translation: Catégorie
    schema:
      is_nullable: true

  - collection: produits
    field: en_stock
    type: boolean
    meta:
      interface: boolean
      note: "Décocher si le produit n'est plus disponible."
      width: half
      conditions:
        - rule:
            _and:
              - statut:
                  _eq: published
          hidden: false
        - rule:
            _and:
              - statut:
                  _neq: published
          hidden: true
      translations:
        - language: fr-FR
          translation: En stock
    schema:
      default_value: true
      is_nullable: false

  - collection: produits
    field: statut
    type: string
    meta:
      interface: select-dropdown
      options:
        choices:
          - text: Publié
            value: published
          - text: Brouillon
            value: draft
      note: "Publié = visible sur le site. Brouillon = visible uniquement ici."
      width: half
      display: labels
      display_options:
        choices:
          - text: Publié
            value: published
            foreground: "#FFFFFF"
            background: "#2ECB71"
          - text: Brouillon
            value: draft
            foreground: "#FFFFFF"
            background: "#95A5A5"
      translations:
        - language: fr-FR
          translation: Statut
    schema:
      default_value: draft
      is_nullable: false

  # ═══════════════════════════════════════════════════════
  # PARAMÈTRES DU SITE (singleton)
  # ═══════════════════════════════════════════════════════
  - collection: parametres_site
    field: id
    type: integer
    meta:
      hidden: true
      interface: input
      readonly: true
      special:
        - auto-increment
    schema:
      is_primary_key: true
      has_auto_increment: true

  - collection: parametres_site
    field: nom_du_site
    type: string
    meta:
      interface: input
      width: half
      translations:
        - language: fr-FR
          translation: Nom du site
    schema:
      is_nullable: true

  - collection: parametres_site
    field: slogan
    type: string
    meta:
      interface: input
      width: half
      translations:
        - language: fr-FR
          translation: Slogan
    schema:
      is_nullable: true

  - collection: parametres_site
    field: description
    type: text
    meta:
      interface: input-multiline
      width: full
      translations:
        - language: fr-FR
          translation: Description
    schema:
      is_nullable: true

  - collection: parametres_site
    field: logo
    type: uuid
    meta:
      interface: file-image
      width: half
      special:
        - file
      translations:
        - language: fr-FR
          translation: Logo
    schema:
      is_nullable: true

  - collection: parametres_site
    field: telephone
    type: string
    meta:
      interface: input
      width: half
      translations:
        - language: fr-FR
          translation: Téléphone
    schema:
      is_nullable: true

  - collection: parametres_site
    field: email
    type: string
    meta:
      interface: input
      options:
        type: email
      width: half
      translations:
        - language: fr-FR
          translation: E-mail
    schema:
      is_nullable: true

  - collection: parametres_site
    field: adresse
    type: text
    meta:
      interface: input-multiline
      width: half
      translations:
        - language: fr-FR
          translation: Adresse
    schema:
      is_nullable: true

  - collection: parametres_site
    field: couleur_principale
    type: string
    meta:
      interface: select-color
      width: half
      translations:
        - language: fr-FR
          translation: Couleur principale
    schema:
      is_nullable: true

relations:
  # Articles → directus_files (image)
  - collection: articles
    field: image
    related_collection: directus_files
    meta:
      many_collection: articles
      many_field: image
      one_collection: directus_files
      one_field: null
    schema:
      on_delete: SET NULL

  # Produits → directus_files (image)
  - collection: produits
    field: image
    related_collection: directus_files
    meta:
      many_collection: produits
      many_field: image
      one_collection: directus_files
      one_field: null
    schema:
      on_delete: SET NULL

  # Paramètres du site → directus_files (logo)
  - collection: parametres_site
    field: logo
    related_collection: directus_files
    meta:
      many_collection: parametres_site
      many_field: logo
      one_collection: directus_files
      one_field: null
    schema:
      on_delete: SET NULL
